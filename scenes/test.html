<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S2 Scenes Test</title>
  <style>
    body { margin: 0; padding: 24px 16px; background: #15171b; color: #e9edf2;
      font: 15px system-ui, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; }
    h1 { margin: 0; font-size: 22px; }
    .note { font-size: 13px; color: #9aa5b3; background: #1e222a; border-inline-start: 3px solid #f5c142;
      padding: 8px 12px; border-radius: 6px; }
    .note b { color: #f5c142; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row span.lbl { font-size: 13px; color: #9aa5b3; min-width: 6em; }
    button { font: 600 14px system-ui, sans-serif; padding: 7px 16px; border: 0;
      border-radius: 999px; background: #f5c142; color: #1d2127; cursor: pointer; }
    button.alt { background: #2a2f38; color: #e9edf2; border: 1px solid #3a414d; }
    button:disabled { opacity: .4; cursor: default; }
    #status { color: #9aa5b3; font-size: 14px; }
    /* Same sizes S3 uses in index.html */
    .gg-stage .cat { width: 17%; }
    .gg-stage .gg-box { width: 15%; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>اختبار المحطات والشاحنة (S2 · Sprint 2)</h1>
    <div class="note" id="note"></div>
    <div id="app"></div>

    <div class="row"><span class="lbl">التنقل</span>
      <button id="prev" type="button">السابق</button>
      <button id="next" type="button">التالي</button>
      <span id="status"></span>
    </div>
    <div class="row"><span class="lbl">الشاحنة</span>
      <button id="gps" type="button" class="alt">إظهار GPS</button>
      <button id="load" type="button" class="alt">تحميل الصندوق</button>
      <button id="drive" type="button" class="alt">انطلاق</button>
      <button id="reset" type="button" class="alt">إعادة</button>
      <button id="play" type="button">▶ مشهد git push كامل</button>
    </div>
  </div>

  <script type="module">
    import { createScenes, equipWand, enableDozing } from './scenes.js';
    import { createCat } from '../cat/cat.js';
    import { createBox } from '../box/box.js';

    // P1 decides the real repo link (station 1). Placeholder until it's in lessons.json.
    const REPO_URL = 'https://github.com/f59aris-cpu/G-G-City.git';

    // Placeholder stations for the ones P1 hasn't added to lessons.json yet
    const PLACEHOLDER_STATIONS = [
      { id: 'workshop', order: 1, title: 'The Workshop', background: 'workshop.png' },
      { id: 'backyard', order: 2, title: 'The Back Yard', background: 'backyard.png' },
      { id: 'charging', order: 3, title: 'The Loading Dock', background: 'charging.png' }
    ];

    const placeholders = [];

    async function loadStations() {
      let real = [];
      try {
        const data = await fetch('../data/lessons.json').then(r => r.json());
        // Background paths in JSON are relative to index.html, so prefix with ../
        real = (data.stations || []).map(s => ({ ...s, background: s.background ? '../' + s.background : '' }));
      } catch (err) {
        console.warn('lessons.json not available:', err);
      }
      const ids = new Set(real.map(s => s.id));
      for (const p of PLACEHOLDER_STATIONS) {
        if (!ids.has(p.id)) { real.push(p); placeholders.push(`station "${p.id}"`); }
      }
      return real;
    }

    const stations = await loadStations();
    const scenes = createScenes(document.getElementById('app'), stations, { truckSrc: 'truck.svg' });
    await scenes.ready;
    window.scenes = scenes; // for testing from the console

    // C3's real box and C1's real cat, on the shared stage
    const box = createBox(scenes.stage(), '../box/box.svg');
    // The cat (C1's design with outlines and the half-moon wand)
    const cat = createCat(scenes.stage(), { svgUrl: '../cat/cat.svg' });
    await Promise.allSettled([box.ready, cat.ready]);
    box.setState('initialized');

    // The wand: built into cat.svg (cat/wand.svg is the same wand on its own)
    try { await equipWand(cat, '../cat/wand.svg'); } catch (e) { console.warn(e); }

    // Expressions: dozes off after 10 s of nothing happening; focused while casting (in scenes.js)
    enableDozing(cat, { after: 10000 });
    box.setLabel('.git');

    // The truck waits at the loading dock
    const truck = scenes.addTruck('charging', { gpsLabel: 'GPS · git push' });
    await truck.ready;
    const realTruck = !truck.el.querySelector('[data-placeholder]');
    if (!realTruck) placeholders.push('truck.svg (S1)');
    if (!stations.some(s => s.repoUrl)) placeholders.push('repo link (P1)');

    document.getElementById('note').innerHTML = placeholders.length
      ? '<b>Placeholders in use:</b> ' + placeholders.join(' · ') + '. They switch to the real files once teammates push them.'
      : 'All real files loaded, no placeholders.';

    // ---- Navigation ----
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const status = document.getElementById('status');
    const truckBtns = ['gps', 'load', 'drive', 'reset', 'play'].map(id => document.getElementById(id));
    let busy = false;

    // Every button is greyed out unless clicking it would actually do something
    function update(text) {
      const i = scenes.current();
      const t = truck.state();
      const atDock = i === t.station;
      prevBtn.disabled = busy || i === 0;
      nextBtn.disabled = busy || i === stations.length - 1;
      const [gpsBtn, loadBtn, driveBtn, resetBtn, playBtn] = truckBtns;
      gpsBtn.disabled = busy || !atDock || t.gps || t.gone;                 // once, at the dock
      loadBtn.disabled = busy || !atDock || !t.gps || t.loaded || t.gone;   // needs a destination first
      driveBtn.disabled = busy || !atDock || !t.loaded || t.gone;           // needs the box on board
      resetBtn.disabled = busy || !(t.gps || t.loaded || t.gone);           // nothing to undo yet
      playBtn.disabled = busy;
      status.textContent = text || `المحطة ${i + 1} من ${stations.length}: ${scenes.stations()[i].title}`;
    }

    // The cat walks while the world scrolls behind it (scenes.travel)
    async function move(ref) {
      busy = true; update('جاري الانتقال…');
      const i = await scenes.travel(ref, cat, box.el);
      console.log('arrived at station', i);
      busy = false; update();
    }

    prevBtn.onclick = () => move(scenes.current() - 1);
    nextBtn.onclick = () => move(scenes.current() + 1);

    // ---- Truck ----
    async function run(label, fn) { busy = true; update(label); await fn(); busy = false; update(); }

    document.getElementById('gps').onclick = () => run('GPS…', () => truck.setGPS(REPO_URL, { caster: cat }));
    document.getElementById('load').onclick = () => run('تحميل…', () => truck.load(box.el, { caster: cat }));
    document.getElementById('drive').onclick = () => run('الشاحنة تنطلق…', () => truck.drive());
    document.getElementById('reset').onclick = () => { truck.reset(); truck.setGPS(''); update(); };

    // The full push scene: go to the dock, show the remote, load the box, drive off
    document.getElementById('play').onclick = async () => {
      truck.reset(); truck.setGPS('');
      if (scenes.stations()[scenes.current()].id !== 'charging') await move('charging');
      await run('git remote add origin …', async () => {
        await truck.setGPS(REPO_URL, { caster: cat });
        await new Promise(r => setTimeout(r, 500));
        await truck.load(box.el, { caster: cat });
        await new Promise(r => setTimeout(r, 400));
        await truck.drive();
      });
      status.textContent = 'git push ✓ الصندوق في طريقه إلى GitHub';
    };

    update();
  </script>
</body>
</html>
