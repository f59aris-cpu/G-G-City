<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -150 60 188" width="60" height="188" xmlns:c2pa="http://c2pa.org/manifest">
  <title>G&amp;G City wand (half moon, matches the hat)</title>
  <desc>Grip point is (0,0), the wand points up (-y). Parts: wand-handle, wand-shaft, wand-glow, wand-tip
  (wand-gem uses the --spell colour), wand-moon, wand-orbit. Same wand as the one built into cat.svg.</desc>
  <g id="wand">
    <g id="wand-handle">
      <rect x="-5" y="-16" width="10" height="44" rx="5" fill="#3b4170"/>
      <path d="M-5 -6 H5 M-5 2 H5 M-5 10 H5" stroke="#2b2f4a" stroke-width="2.4"/>
      <rect x="-6" y="-19" width="12" height="5" rx="2" fill="#f5c142"/>
      <circle cx="0" cy="31" r="4.5" fill="#f5c142"/>
    </g>
    <path id="wand-shaft" d="M-3.8 -16 L-2 -104 L2 -104 L3.8 -16 Z" fill="#2b2f4a"/>
    <rect x="-3.2" y="-60" width="6.4" height="3" rx="1" fill="#f5c142"/>
    <g id="wand-glow" opacity="0">
      <circle cx="2" cy="-123" r="28" style="fill: var(--spell, #f5c142)" opacity=".13"/>
      <circle cx="2" cy="-123" r="18" style="fill: var(--spell, #f5c142)" opacity=".28"/>
    </g>
    <g id="wand-tip">
      <!-- Half moon, drawn the same way as the moon on the cat's hat (gold circle, navy bite) -->
      <g id="wand-moon">
        <circle cx="0" cy="-122" r="15" fill="#f5c142"/>
        <circle cx="7" cy="-127" r="12.5" fill="#2b2f4a"/>
      </g>
      <circle id="wand-gem" cx="6" cy="-126" r="4.5" style="fill: var(--spell, #f5c142)" stroke="#fff3b0" stroke-width="1.2"/>
      <g id="wand-orbit">
        <path d="M-17 -138 l1 2.6 2.7 .2 -2.1 1.8 .6 2.6 -2.2 -1.4 -2.2 1.4 .6 -2.6 -2.1 -1.8 2.7 -.2 Z" fill="#fff3b0"/>
        <circle cx="18" cy="-104" r="1.8" fill="#fff3b0"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
